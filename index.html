<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111418">
  <title>entreno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>entreno</h1>
  </header>

  <main class="app-main">
    <section class="empty-state" id="empty-state">
      <p class="empty-state__title">Todavía no tenés entrenamientos</p>
      <p class="empty-state__text">Creá el primero para empezar.</p>
    </section>

    <ul class="workout-list" id="workout-list"></ul>
  </main>

  <footer class="app-footer">
    <button class="btn btn--primary" id="new-workout-btn" type="button">
      + Nuevo entrenamiento
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
