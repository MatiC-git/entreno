<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111418">
  <title>entreno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>entreno</h1>
  </header>

  <main class="app-main">
    <section class="empty-state" id="empty-state">
      <p class="empty-state__title">Todavía no tenés entrenamientos</p>
      <p class="empty-state__text">Creá el primero para empezar.</p>
    </section>

    <ul class="workout-list" id="workout-list"></ul>
  </main>

  <footer class="app-footer">
    <button class="btn btn--primary" id="new-workout-btn" type="button">
      + Nuevo entrenamiento
    </button>
  </footer>

  <!-- Pantalla para crear o editar un entrenamiento -->
  <dialog class="editor" id="workout-editor" aria-labelledby="editor-title">
    <form class="editor__form" id="workout-form">
      <header class="editor__header">
        <button class="btn-text" id="cancel-btn" type="button">Cancelar</button>
        <h2 class="editor__title" id="editor-title">Nuevo entrenamiento</h2>
      </header>

      <div class="editor__body">
        <label class="field">
          <span class="field__label">Nombre</span>
          <input class="field__input" id="workout-name" type="text"
                 placeholder="Ej: Piernas" maxlength="40" required pattern=".*\S.*">
        </label>

        <h3 class="editor__subtitle">Ejercicios</h3>
        <ol class="exercise-fields" id="exercise-fields"></ol>

        <button class="btn btn--secondary" id="add-exercise-btn" type="button">
          + Agregar ejercicio
        </button>
      </div>

      <footer class="editor__footer">
        <button class="btn btn--primary" type="submit">Guardar</button>
        <!-- Solo se muestra al editar un entrenamiento que ya existe -->
        <button class="btn btn--danger" id="delete-workout-btn" type="button" hidden>
          Borrar entrenamiento
        </button>
      </footer>
    </form>
  </dialog>

  <!-- Molde de cada ejercicio; app.js lo copia cada vez que se agrega uno -->
  <template id="exercise-row-template">
    <li class="exercise-row">
      <div class="exercise-row__top">
        <input class="field__input exercise-row__name" type="text" placeholder="Ej: Sentadilla"
               maxlength="40" required pattern=".*\S.*" aria-label="Nombre del ejercicio">
        <button class="exercise-row__remove" type="button" aria-label="Quitar ejercicio">✕</button>
      </div>
      <div class="exercise-row__numbers">
        <label class="mini-field">
          <input class="field__input exercise-row__sets" type="number" inputmode="numeric"
                 min="1" max="20" value="3" required>
          <span>series</span>
        </label>
        <label class="mini-field">
          <input class="field__input exercise-row__reps" type="number" inputmode="numeric"
                 min="1" max="100" value="10" required>
          <span>reps</span>
        </label>
        <label class="mini-field">
          <input class="field__input exercise-row__rest" type="number" inputmode="numeric"
                 min="5" max="600" value="90" required aria-label="Descanso en segundos">
          <span>s desc.</span>
        </label>
      </div>
    </li>
  </template>

  <!-- Pantalla del timer de descanso -->
  <dialog class="timer" id="rest-timer" aria-labelledby="timer-label">
    <div class="timer__content">
      <p class="timer__label" id="timer-label">Descanso</p>
      <p class="timer__exercise" id="timer-exercise"></p>
      <p class="timer__time" id="timer-time" role="timer">0:00</p>
      <div class="timer__progress">
        <div class="timer__progress-fill" id="timer-progress"></div>
      </div>
      <p class="timer__done-text" id="timer-done-text" hidden>¡A la próxima serie!</p>
    </div>

    <footer class="timer__footer">
      <div class="timer__controls" id="timer-controls">
        <button class="btn btn--ghost" id="timer-add-btn" type="button">+15s</button>
        <button class="btn btn--ghost" id="timer-pause-btn" type="button">Pausar</button>
        <button class="btn btn--primary" id="timer-skip-btn" type="button">Saltear</button>
      </div>
      <button class="btn btn--primary" id="timer-close-btn" type="button" hidden>Listo</button>
    </footer>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
